name: Build release artifacts
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check version and release notes
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            git merge-base --is-ancestor HEAD origin/main
            python3 scripts/release.py check --tag "$RELEASE_TAG"
          else
            python3 scripts/release.py check
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo fmt --all --check
      - run: cargo test -p gen3-core -p gen3-cli --locked
      - run: cargo clippy -p gen3-core -p gen3-cli --all-targets --all-features --locked -- -D warnings
      - run: npm run format:check
      - run: npm run build
      - run: python3 scripts/test_official_stats.py
      - run: python3 scripts/test_release.py
      - run: python3 scripts/test_species_mapping_review.py
      - run: node scripts/test_species_mappings.mjs
      - run: node scripts/test_species_forms.mjs
      - run: node scripts/test_evolution_graph.mjs
      - run: node scripts/test_hidden_power.mjs
  bundle:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            bundles: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run desktop:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Stage installer and bilingual documentation
        run: python scripts/release.py stage --bundle target/${{ matrix.target }}/release/bundle --output release-assets --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
  draft:
    if: github.ref_type == 'tag'
    needs: [validate, bundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Extract notes and calculate checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py check --tag "$RELEASE_TAG" --notes release-notes.md
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Create a draft for human release review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft             --title "Gen III ROM Hack Editor $RELEASE_TAG" --notes-file release-notes.md
