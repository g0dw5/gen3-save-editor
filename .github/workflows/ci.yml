name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core-and-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo fmt --all --check
      - run: cargo test -p gen3-core -p gen3-cli --locked
      - run: cargo clippy -p gen3-core -p gen3-cli --all-targets --all-features --locked -- -D warnings
      - run: npm run format:check
      - run: npm run build
      - run: python3 scripts/test_official_stats.py
      - run: python3 scripts/release.py check
      - run: python3 scripts/test_release.py
      - run: python3 scripts/test_species_mapping_review.py
      - run: node scripts/test_species_mappings.mjs
      - run: node scripts/test_species_forms.mjs
      - run: node scripts/test_evolution_graph.mjs
      - run: node scripts/test_hidden_power.mjs
      - name: Install browser regression tools
        run: |
          python3 -m pip install playwright==1.60.0
          python3 -m playwright install --with-deps chrome
      - name: Cross-adapter browser regressions (synthetic fixtures)
        timeout-minutes: 10
        run: |
          npm run dev > /tmp/gen3-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5173 > /dev/null && break
            sleep 1
          done
          failed=0
          for script in test_adapter_ui test_drag_transactions test_editor_navigation \
            test_reference_navigation test_hidden_power_ui test_search_origins \
            test_reference_readability test_evolution_reference_ui test_species_forms_ui; do
            python3 "scripts/$script.py" || failed=1
          done
          exit "$failed"
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run desktop:build -- --no-bundle
