[workspace]
members = ["crates/gen3-core", "crates/gen3-cli", "apps/desktop"]
default-members = ["crates/gen3-core", "crates/gen3-cli"]
resolver = "2"

[workspace.package]
version = "0.1.8"
edition = "2021"
license = "MIT"
repository = "https://github.com/g0dw5/gen3-save-editor"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
md-5 = "0.10"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Network-mounted workspaces may not support rustc's incremental file locks.
[profile.dev]
incremental = false

[profile.test]
incremental = false
